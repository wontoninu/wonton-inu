<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wonton Inu</title>
    <style>
        body {
            background-color: black;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        img {
            margin-bottom: 40px;
        }
        .social-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }
        .social-button {
            padding: 10px 15px;
            background-color: white;
            color: black;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .social-button:hover {
            background-color: grey;
        }
        .website-link {
            display: block;
            text-align: center;
            padding: 15px 30px;
            background-color: white;
            color: black;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
            font-weight: bold;
            font-size: 18px;
        }
        .website-link:hover {
            background-color: grey;
        }
    </style>
</head>
<body>
    <img src="banner.png" alt="Wonton Inu Banner">
    <a href="https://wonton-inu.replit.app" class="website-link">Visit Website</a>
    <div class="social-buttons">
        <a href="#" class="social-button">Facebook</a>
        <a href="#" class="social-button">Twitter</a>
        <a href="#" class="social-button">Instagram</a>
    </div>
</body>
</html>
