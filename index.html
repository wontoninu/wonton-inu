<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Buttons</title>
</head>
<body>
    <div class="social-buttons">
        <a href="https://t.me/your_channel" target="_blank">Telegram</a>
        <a href="https://basescan.com/" target="_blank">BaseScan</a>
        <button onclick="copyTokenAddress()">Copy Token Address</button>
    </div>

    <script>
        function copyTokenAddress() {
            const tokenAddress = 'YOUR_TOKEN_ADDRESS'; // Replace with the actual token address
            navigator.clipboard.writeText(tokenAddress).then(() => {
                alert('Token address copied!');
            });
        }
    </script>
</body>
</html>
